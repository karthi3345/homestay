[build]
  command = "npm run build"
  publish = "dist"

[functions]
  included_files = ["data/homestays.json", "styles.css", "calendar.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api"
  status = 200



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
