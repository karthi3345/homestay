[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = ["data/homestays.json", "data/site-settings.json", "styles.css", "calendar.js", "admin/**"]

[functions.sync]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api"
  status = 200



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
